<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>夜読文庫</title>
<meta name="description" content="如月風鈴的私人藏書 · 非官方中文譯本" />
<meta name="theme-color" content="#0a0908" />
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/seal.png" />
<link rel="preload" href="assets/fonts/lxgw-regular.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/lxgw-medium.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/app.css" />
</head>
<body>
<div class="aura"></div>
<div class="grain"></div>

<header class="site-head wrap">
  <div class="brandline">
    <div class="brand">
      <div class="kicker" id="siteEn">YODOKU BUNKO</div>
      <h1 id="siteTitle">夜読文庫</h1>
      <p class="tagline" id="siteSub">私人藏書 · 非官方中文譯本</p>
    </div>

    <div class="owner">
      <div class="owner__id">
        <div class="owner__name">如月風鈴</div>
        <div class="owner__role">譯者 · 藏書人</div>
      </div>
      <div class="owner__face">
        <img src="assets/img/avatar.webp" alt="如月風鈴" width="76" height="76" />
        <span class="owner__stamp">鈴</span>
      </div>
    </div>
  </div>

  <p class="motto"><span class="motto__tick"></span>把別人的聲音，留在紙上。</p>

  <div class="rule"></div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-num" id="statBooks">—</span>
      <span class="stat-label">作品</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="statChapters">—</span>
      <span class="stat-label">章節</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="statWords">—</span>
      <span class="stat-label">字數</span>
    </div>
  </div>

  <div class="toolbar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      <input id="q" type="search" placeholder="搜尋書名、標籤…" autocomplete="off" spellcheck="false" />
    </label>
    <div class="chiprow" id="tags"></div>
  </div>
</header>

<main class="wrap">
  <div class="shelf" id="shelf">
    <div class="loading" style="grid-column: 1/-1">LOADING</div>
  </div>

  <section class="colophon" aria-label="藏書資訊">
    <div class="colophon__sign">
      <div class="colophon__sig">如月風鈴</div>
      <div class="colophon__seal">風<br />鈴</div>
    </div>
    <div class="colophon__grid">
      <div class="colophon__cell">
        <h4>藏書</h4>
        <p id="cfBooks">—</p>
      </div>
      <div class="colophon__cell">
        <h4>譯文</h4>
        <p>非官方中文譯本<br />僅供私人閱讀</p>
      </div>
      <div class="colophon__cell">
        <h4>字體</h4>
        <p><a class="foot-link" href="assets/fonts/OFL.txt" target="_blank" rel="noopener">霞鹜文楷 LXGW WenKai</a><br />SIL OFL 1.1</p>
      </div>
      <div class="colophon__cell">
        <h4>建置</h4>
        <p id="cfBuilt">—</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-foot wrap">
  <span id="footNote">本站內容僅供私人閱讀。</span>
  <span class="foot-right">
    <span class="seal">墨 · 燈 · 卷</span>
  </span>
</footer>

<!-- 18+ gate -->
<div class="gate" id="gate" hidden>
  <div class="gate__card">
    <div class="gate__age">18+</div>
    <h2>成人內容</h2>
    <p>本藏書含成人向文學作品，僅限年滿十八歲之讀者閱覽。<br />點擊「進入」即表示你已達到法定年齡，並自願閱讀。</p>
    <div class="gate__actions">
      <button class="btn" id="gateNo">離開</button>
      <button class="btn btn--gold" id="gateYes">進入</button>
    </div>
  </div>
</div>

<script type="module" src="assets/library.js"></script>
</body>
</html>
